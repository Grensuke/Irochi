# STATUS: CHECKPOINT 4 — DUMMY END-TO-END BASELINE
#
# This docker-compose.yml is intended for the current
# dummy phase. The backend and frontend Dockerfiles
# now exist and are wired to these services.
#
# Prerequisites:
#
#   1. A local .env file must be created locally
#      from .env.example before running.
#
# NOTE: Docker has NOT been locally validated in this
# environment because Docker is not installed.
# Do not claim that `docker compose up` or the Docker
# builds have been successfully tested.
# ==================================================

version: "3.9"

services:
  # ------------------------------------------------
  # Backend — FastAPI (dummy)
  # ------------------------------------------------
  # Requires: backend/Dockerfile (Checkpoint 2)
  # ------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irochi-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ------------------------------------------------
  # Frontend — React + Vite (dummy)
  # ------------------------------------------------
  # Requires: frontend/Dockerfile (Checkpoint 3)
  # ------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: irochi-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

