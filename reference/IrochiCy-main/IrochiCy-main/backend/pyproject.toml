[project]
name = "sih26145-backend"
version = "1.0.0"
description = "SIH26145 — Network Threat Detection & Security Intelligence Hub"
requires-python = ">=3.11"
readme = "RUNBOOK.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: marks tests as end-to-end (require live stack)",
    "slow: marks tests as slow/load tests (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
