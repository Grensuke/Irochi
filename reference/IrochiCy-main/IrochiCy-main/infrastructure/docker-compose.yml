# ═══════════════════════════════════════════════════════════════
# SIH26145 — Unified Docker Compose (All Phases)
# ═══════════════════════════════════════════════════════════════
# Start:  docker compose up -d
# Status: docker compose ps
# Logs:   docker compose logs -f <service>
# Stop:   docker compose down
# Reset:  docker compose down -v  (WARNING: deletes all data)
# ═══════════════════════════════════════════════════════════════

services:

  # ── CORE INFRASTRUCTURE ───────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sih26145_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih26145_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: sih26145_redpanda
    restart: unless-stopped
    command:
      - redpanda start --smp 2 --memory 1G --overprovisioned --node-id 0
        --kafka-addr PLAINTEXT://0.0.0.0:9092
        --advertise-kafka-addr PLAINTEXT://localhost:9092
        --pandaproxy-addr 0.0.0.0:8082
        --advertise-pandaproxy-addr localhost:8082
        --set redpanda.auto_create_topics_enabled=true
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
      - "127.0.0.1:8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|healthy' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: sih26145_rpk_console
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"

  # ── ZEEK ──────────────────────────────────────────────────

  zeek:
    image: zeek/zeek:6.0.4
    container_name: sih26145_zeek
    restart: "no"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./zeek/site:/usr/local/zeek/share/zeek/site:ro
      - zeek_logs:/zeek-logs
      - ./pcaps:/pcaps:ro
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]

  # ── PIPELINE WORKERS ──────────────────────────────────────

  normalizer:
    build:
      context: ../pipeline
      dockerfile: Dockerfile.normalizer
    container_name: sih26145_normalizer
    restart: unless-stopped
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NORMALIZER_MODE: watch
      ZEEK_LOG_DIR: /zeek-logs
    volumes:
      - zeek_logs:/zeek-logs:ro
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  feature_worker:
    build:
      context: ../pipeline
      dockerfile: Dockerfile.worker
    container_name: sih26145_feature_worker
    restart: unless-stopped
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      normalizer:
        condition: service_started

  # ── OBSERVABILITY ─────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sih26145_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sih26145_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

# ── VOLUMES ───────────────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  zeek_logs:         # Shared between zeek and normalizer containers
  grafana_data:
