# SIH26145 — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI backend metrics
  - job_name: fastapi
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  # Redpanda internal metrics
  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics
